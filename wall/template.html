<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Big Wall · Future Party 2050</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Instrument+Serif&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The Big Wall: one long show reel built from every piece on the wall. A start screen with the chapters,
   then a fullscreen player that is always dark, like the wall. The display face is League Gothic (the films'
   own type), quotes are in Instrument Serif like the quote wall, labels in JetBrains Mono. */
:root{
  --bg:#050506; --fg:#ffffff; --fg-2:#d4d4d8; --muted:#a1a1a6; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --accent:#ff5315; --accent-hot:#f92f02; --accent-ink:#ff6a33;
  --display:"League Gothic","Impact","Arial Narrow",sans-serif;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--line-2)}
a:hover{text-decoration-color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* Start screen */
.home{max-width:1200px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.home nav{display:flex;justify-content:space-between;gap:12px;font:500 13px/1 var(--mono);letter-spacing:.04em;color:var(--muted);padding-block:4px 28px}
.home nav a{text-decoration:none;color:var(--muted)} .home nav a:hover{color:var(--fg)}
.eb{margin:0;font:500 12px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.home h1{margin:12px 0 0;font:400 clamp(76px,16vw,220px)/.84 var(--display);text-transform:uppercase;letter-spacing:.005em}
.home h1 span{color:var(--accent)}
.home .lead{margin:22px 0 0;font-size:clamp(17px,2vw,21px);line-height:1.5;color:var(--fg-2);max-width:64ch}
.home .lead b{color:var(--fg);font-weight:600}
.go{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--font);color:#070708;background:var(--accent);border:0;border-radius:999px;padding:14px 20px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--accent-hot)}
.btn .tri{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ghost{font:500 14px/1 var(--font);color:var(--fg-2);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:12px 16px;cursor:pointer}
.ghost:hover{border-color:var(--fg-2);color:var(--fg)}
.keys{font:400 13px/1.6 var(--mono);color:var(--muted)}
.chapters{list-style:none;margin:44px 0 0;padding:0;border-top:1px solid var(--line)}
.chapters li{border-bottom:1px solid var(--line)}
.chapters button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 18px;align-items:baseline;width:100%;padding:18px 4px;cursor:pointer}
.chapters button:hover .ct,.chapters button:focus-visible .ct{color:var(--c)}
.chapters button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chapters .cn{font:500 13px var(--mono);color:var(--c)}
.chapters .ct{font:400 clamp(34px,4.6vw,56px)/.95 var(--display);text-transform:uppercase;transition:color .2s}
.chapters .cl{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.chapters .cs{grid-column:2/4;color:var(--fg-2);font-size:15px}
.chapters .ch{grid-column:2/4;font:400 12.5px/1.6 var(--mono);color:var(--muted)}
@media (max-width:560px){.chapters button{grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px}}
.home .note{margin-top:22px;font-size:14px;color:var(--muted);max-width:70ch}

/* The player */
.pj{position:fixed;inset:0;z-index:10;background:#000;color:#fff;overflow:hidden}
.pj.idle{cursor:none}
.stage{position:absolute;inset:0;cursor:pointer}
.pj.idle .stage{cursor:none}
.s{position:absolute;inset:0;overflow:hidden;background:var(--bg);animation:sIn .7s ease both}
.s.out{animation:sOut .55s ease both;pointer-events:none}
@keyframes sIn{from{opacity:0}to{opacity:1}}
@keyframes sOut{to{opacity:0}}
.glow{position:absolute;inset:-15%;background:radial-gradient(circle at var(--gx,24%) var(--gy,30%),var(--c) 0%,transparent 46%);opacity:.32;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-2%,-1%) scale(1)}to{transform:translate(3%,2%) scale(1.08)}}
.in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8vh max(7vw,calc(env(safe-area-inset-right,0px) + 20px)) 12vh max(7vw,calc(env(safe-area-inset-left,0px) + 20px))}
.k{margin:0;font:500 clamp(12px,1.05vw,19px)/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c);animation:fade .6s ease both}
.k.w{color:#ff6a33}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
@keyframes blur{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:none}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.d1{animation:up .8s cubic-bezier(.2,.7,.2,1) .2s both}
.d2{animation:up .8s cubic-bezier(.2,.7,.2,1) .85s both}
.d3{animation:fade .8s ease 1.4s both}

/* Chapter card and intro */
.k-card .big,.k-intro .big{margin:.08em 0 0;font:400 clamp(110px,24vw,440px)/.8 var(--display);text-transform:uppercase;letter-spacing:.005em;animation:rise 1s cubic-bezier(.2,.7,.2,1) .1s both}
.k-card .sub{margin:.7em 0 0;font:500 clamp(20px,2.3vw,42px)/1.3 var(--font);color:#e4e4e7;max-width:34ch}
.k-card .has{margin:1.6em 0 0;font:400 clamp(12px,1.05vw,19px)/1.6 var(--mono);color:#9a9aa3;display:flex;gap:.9em;align-items:center}
.k-card .has::before,.k-fact .src::before,.k-quote .by::before,.k-idea .src::before{content:"";flex:none;width:2.4em;height:2px;background:var(--c)}
.k-intro .big{color:var(--accent)}
.k-intro .rows{margin:.9em 0 0;display:flex;flex-wrap:wrap;gap:.2em .9em;font:400 clamp(26px,3.6vw,66px)/1.05 var(--display);text-transform:uppercase;max-width:22ch}
.k-intro .rows span{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.k-intro .rows b{font-weight:400;color:#ff6a33}

/* Six Facts */
.k-fact .num{margin:.05em 0 0;font:400 clamp(120px,21vw,400px)/.82 var(--display);color:var(--c);font-variant-numeric:tabular-nums;animation:rise .9s cubic-bezier(.2,.7,.2,1) .1s both;white-space:nowrap}
.k-fact .num.long{font-size:clamp(84px,13vw,250px)}
.k-fact .txt{margin:.5em 0 0;font:600 clamp(22px,2.7vw,50px)/1.22 var(--font);letter-spacing:-.02em;max-width:30ch;text-wrap:balance}
.k-fact .src{margin:1.5em 0 0;font:400 clamp(12px,1.05vw,19px)/1.5 var(--mono);color:#9a9aa3;display:flex;gap:.9em;align-items:center}

/* Further: a photo with the claim on it */
.ph{position:absolute;inset:0;background:#000}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb var(--kb,12s) ease-out both}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.42) 48%,rgba(0,0,0,.05) 100%),linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 46%)}
.strong .scrim{background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,.25) 100%),linear-gradient(0deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,0) 50%)}
.k-further .in{justify-content:flex-end;padding-bottom:13vh}
.k-further .hero{margin:.12em 0 0;font:400 clamp(60px,9.6vw,190px)/.86 var(--display);text-transform:uppercase;max-width:13ch;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.4)}
.k-further .seed{margin:.8em 0 0;font:500 clamp(18px,2vw,36px)/1.32 var(--font);color:#ececef;max-width:38ch}
.k-further .seed b{color:#ff6a33;font-weight:600;margin-right:.45em}
.k-further .film{margin:.9em 0 0;font:400 clamp(12px,1.05vw,19px)/1.4 var(--mono);color:#c2c2c8}
.credit{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font:400 clamp(10px,.8vw,14px)/1.3 var(--mono);color:rgba(255,255,255,.6);max-width:70ch;text-align:right}

/* Quote */
.k-quote .q{margin:.45em 0 0;font:400 clamp(40px,5.6vw,108px)/1.06 var(--serif);max-width:24ch;text-wrap:balance;animation:blur 1.1s ease .15s both}
.k-quote .q.sz-m{font-size:clamp(34px,4.5vw,86px);max-width:28ch}
.k-quote .q.sz-s{font-size:clamp(28px,3.5vw,66px);max-width:32ch}
.k-quote .q em{font-style:italic}
.k-quote .qm{color:#ff6a33}
.k-quote .by{margin:1.2em 0 0;font:400 clamp(13px,1.1vw,20px)/1.5 var(--mono);color:#a1a1a6;display:flex;gap:.9em;align-items:center;flex-wrap:wrap}
.k-quote .by b{color:#fff;font-weight:500}

/* Idea */
.k-idea .h{margin:.4em 0 0;font:800 clamp(36px,6.1vw,120px)/.98 var(--font);letter-spacing:-.045em;max-width:15ch;text-wrap:balance;animation:rise .95s cubic-bezier(.2,.7,.2,1) .15s both}
.k-idea .t{margin:.9em 0 0;font-size:clamp(17px,1.95vw,35px);line-height:1.42;color:#cfcfd4;max-width:44ch;text-wrap:pretty}
.k-idea .now{margin:1em 0 0;font:500 clamp(14px,1.35vw,24px)/1.45 var(--font);color:#e4e4e7;max-width:52ch}
.k-idea .now span{font:500 .72em/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:.3em .45em;margin-right:.7em;vertical-align:.12em}
.k-idea .src{margin:1.4em 0 0;font:400 clamp(12px,1.05vw,19px)/1.5 var(--mono);color:#9a9aa3;display:flex;gap:.9em;align-items:center}

/* Tweet */
.k-tweet .who{display:flex;align-items:center;gap:clamp(12px,1.3vw,24px);margin-top:1.1em;animation:fade .6s ease .1s both}
.k-tweet .av{width:clamp(48px,5vw,96px);height:clamp(48px,5vw,96px);border-radius:50%;object-fit:cover;background:#1a1a1d;flex:none;border:2px solid var(--c)}
.k-tweet .nm{font:700 clamp(18px,1.9vw,34px)/1.15 var(--font);letter-spacing:-.01em}
.k-tweet .rl{font:400 clamp(13px,1.15vw,21px)/1.35 var(--font);color:#a1a1a6;margin-top:.2em}
.k-tweet .tx{margin:.75em 0 0;font:500 clamp(30px,3.9vw,74px)/1.16 var(--font);letter-spacing:-.025em;max-width:26ch;white-space:pre-line;text-wrap:pretty;animation:up .9s cubic-bezier(.2,.7,.2,1) .25s both}
.k-tweet .tx.sz-m{font-size:clamp(24px,3vw,56px);max-width:32ch}
.k-tweet .tx.sz-s{font-size:clamp(19px,2.25vw,42px);max-width:40ch;line-height:1.24}
.k-tweet .meta{margin:1.3em 0 0;font:400 clamp(12px,1.05vw,19px)/1.5 var(--mono);color:#9a9aa3}

/* Concept art */
.k-pic .bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(42px) brightness(.42) saturate(1.2)}
.k-pic .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:kb var(--kb,8s) ease-out both}
.k-pic .cap{position:absolute;left:max(4vw,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(5vh + env(safe-area-inset-bottom,0px));max-width:min(60ch,80vw);padding:.85em 1.1em;border-radius:10px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:up .8s cubic-bezier(.2,.7,.2,1) .9s both}
.k-pic .cap b{display:block;font:600 clamp(15px,1.45vw,26px)/1.3 var(--font)}
.k-pic .cap span{display:block;margin-top:.3em;font:400 clamp(11px,.95vw,17px)/1.4 var(--mono);color:#b9b9c0}

/* Films */
.k-film{background:#000}
.k-film video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.k-film .tag{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px));margin:0;font:500 clamp(12px,1vw,17px)/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:.5em .75em;border-radius:6px;animation:tagOut 6s ease both}
@keyframes tagOut{0%,75%{opacity:1}100%{opacity:0}}

/* Chapter chip, bar and progress */
.chip{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px));display:flex;gap:.7em;align-items:center;font:500 clamp(11px,.9vw,16px)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 1px 10px rgba(0,0,0,.7);pointer-events:none;z-index:2}
.chip i{width:.7em;height:.7em;border-radius:50%;background:var(--c)}
.paused{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#d4d4d8;text-shadow:0 1px 10px rgba(0,0,0,.7);z-index:2}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:30px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8));transition:opacity .35s}
.pj.idle .bar{opacity:0;pointer-events:none}
.bar button{font:500 13.5px/1 var(--font);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 14px;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.16)}
.bar button[aria-current="true"]{border-color:var(--c);color:#fff;background:rgba(255,255,255,.14)}
.bar .cnt{font:400 12.5px var(--mono);color:#a1a1a6;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.bar .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}
@media (max-width:760px){.bar .chs{display:none}}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);z-index:4}
.prog i{display:block;height:100%;width:0;background:var(--c,#ff5315)}

@media (prefers-reduced-motion: reduce){
  .glow,.ph img,.k-pic .fg{animation:none}
  .s *{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<main class="home" id="home">
  <nav><a href="../../index.html">← Future Party 2050</a><span id="homeLen"></span></nav>
  <p class="eb">Future Party 2050 · on the wall</p>
  <h1>The Big <span>Wall</span></h1>
  <p class="lead" id="lead"></p>
  <div class="go">
    <button type="button" class="btn" id="start"><span class="tri" aria-hidden="true"></span>Start the wall</button>
    <span class="keys">F fullscreen · Space pause · ← → slides · 1–6 chapters · M sound · Esc back here</span>
  </div>
  <ol class="chapters" id="chapters"></ol>
  <p class="note" id="note"></p>
</main>

<div class="pj" id="pj" role="dialog" aria-modal="true" aria-label="The Big Wall" hidden>
  <div class="stage" id="stage" aria-live="off"></div>
  <div class="chip" id="chip" hidden><i></i><span></span></div>
  <span class="paused" id="paused" hidden>Paused</span>
  <div class="bar" id="bar">
    <button type="button" id="bPrev" aria-label="Previous slide">←</button>
    <button type="button" id="bPlay">Pause</button>
    <button type="button" id="bNext" aria-label="Next slide">→</button>
    <span class="cnt" id="cnt"></span>
    <span class="sep chs" aria-hidden="true"></span>
    <span class="chs" id="chs" style="display:contents"></span>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="bSound">Sound off</button>
    <button type="button" id="bFull">Fullscreen</button>
    <button type="button" id="bExit">Exit</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
</div>

<script>
(function(){
const D=/*DATA*/{};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const words=s=>String(s).split(/\s+/).filter(Boolean).length;
const mmss=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const UP=D.up, PL=D.loop, C=D.counts;
const CH={};D.chapters.forEach((c,i)=>{CH[c.id]=Object.assign({i:i},c)});
const colorOf=id=>(CH[id]||{}).color||'#ff5315';
const HAS={facts:['fact','facts'],further:['prediction','predictions'],quotes:['quote','quotes'],ideas:['idea','ideas'],tweets:['tweet','tweets']};
const hasLine=h=>Object.keys(HAS).filter(k=>h[k]).map(k=>h[k]+' '+HAS[k][h[k]===1?0:1]).join(' · ');
const GL=[['22%','30%'],['78%','26%'],['70%','78%'],['26%','74%'],['52%','18%'],['84%','60%']];

/* ---------- start screen ---------- */
$('homeLen').textContent='about '+Math.round(D.total/60)+' min a loop';
$('lead').innerHTML='Everything on the wall in one loop, like one long show reel: <b>'+C.facts+' facts</b> about how books guess the future, <b>'+C.further+' predictions</b> from Further over their photos, <b>'+C.quotes+' quotes</b> from the books, <b>'+C.ideas+' ideas</b> for 2050, <b>'+C.tweets+' tweets</b> by futurists and the concept art from Imagined Futures, sorted into six chapters. It opens with the Six Facts film and closes with Further, then starts again.';
$('chapters').innerHTML=D.chapters.map((c,i)=>'<li style="--c:'+esc(c.color)+'"><button type="button" data-ch="'+esc(c.id)+'"><span class="cn">'+(i+1)+'</span><span class="ct">'+esc(c.title)+'</span><span class="cl">'+mmss(c.sec)+'</span><span class="cs">'+esc(c.sub)+'</span><span class="ch">'+esc(hasLine(c.has))+(c.pictures?' · '+c.pictures+' pictures':'')+'</span></button></li>').join('');
$('note').textContent='Each loop deals out the next pictures, so the concept art changes from one loop to the next ('+C.pictures+' pictures in all). The films play the 1080p renders when they are in the folder, otherwise the 720p previews. They start muted when the wall opens from a link; press M for sound.';

/* ---------- pictures: dealt in turn by theme, the place is kept between loops and visits ---------- */
const PKEY='fp2050-bigwall-pictures';
let ptr={};try{ptr=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}}catch(e){ptr={}}
let used={};
let originals=false;
(function(){const t=Object.keys(D.themes)[0];if(!t)return;const im=new Image();im.onload=()=>{originals=true};im.src=UP+D.themes[t][0].file})();
function deal(ch){
  const prefs=(D.art[ch]||[]).filter(t=>D.themes[t]&&D.themes[t].length);
  if(!prefs.length)return null;
  let best=prefs[0],bv=Infinity;
  prefs.forEach(t=>{const v=(used[t]||0)/D.themes[t].length;if(v<bv){bv=v;best=t}});
  used[best]=(used[best]||0)+1;
  const list=D.themes[best],n=(ptr[best]||0)%list.length;ptr[best]=n+1;
  try{localStorage.setItem(PKEY,JSON.stringify(ptr))}catch(e){}
  return list[n];
}
const picOf=it=>{if(it.k==='pic'&&!it.pic)it.pic=deal(it.ch);return it.pic};
const picSrc=p=>UP+(originals?p.file:p.thumb);
function newLoop(){used={};PL.forEach(it=>{if(it.k==='pic')delete it.pic})}

/* ---------- slides ---------- */
const qh=s=>esc(s).replace(/'/g,'’').replace(/\*([^*]+)\*/g,'<em>$1</em>');
const size=(n,a,b)=>n<=a?'':(n<=b?' sz-m':' sz-s');
function build(it,pos){
  const s=document.createElement('div');
  const c=colorOf(it.ch),g=GL[pos%GL.length];
  s.className='s k-'+it.k;s.style.setProperty('--c',it.k==='quote'||it.k==='idea'?(it.c||c):c);s.style.setProperty('--gx',g[0]);s.style.setProperty('--gy',g[1]);
  const glow='<div class="glow"></div>';
  if(it.k==='intro'){
    const rows=[[C.facts,'facts'],[C.further,'predictions'],[C.quotes,'quotes'],[C.ideas,'ideas'],[C.tweets,'tweets'],[C.pictures,'pictures']];
    s.innerHTML=glow+'<div class="in"><p class="k w">Future Party 2050 · the big wall</p><p class="big">2050</p><p class="rows">'+rows.map((r,i)=>'<span style="animation-delay:'+(0.9+i*0.35).toFixed(2)+'s"><b>'+r[0]+'</b> '+r[1]+'</span>').join('')+'</p></div>';
  }else if(it.k==='card'){
    s.innerHTML=glow+'<div class="in"><p class="k">Chapter '+it.n+' of '+it.of+' · '+Math.max(1,Math.round(it.sec/60))+' min</p><p class="big">'+esc(it.title)+'</p><p class="sub d2">'+esc(it.sub)+'</p><p class="has d3">'+esc(hasLine(it.has))+'</p></div>';
  }else if(it.k==='fact'){
    const long=String(it.num).length>5;
    s.innerHTML=glow+'<div class="in"><p class="k">Six Facts · '+esc(String(it.id).replace('c',''))+' of 6</p><p class="num'+(long?' long':'')+'">'+esc(it.num)+'</p><p class="txt d2">'+esc(it.text)+'</p><p class="src d3">'+esc(it.src)+'</p></div>';
    if(it.count&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const el=s.querySelector('.num'),f=it.count.from||0,t=it.count.to,suf=it.count.suffix||'',t0=performance.now()+250;
      el.textContent=f+suf;
      const step=now=>{if(!s.isConnected)return;const p=Math.min(1,Math.max(0,(now-t0)/1500)),e=1-Math.pow(1-p,3);el.textContent=Math.round(f+(t-f)*e)+suf;if(p<1)requestAnimationFrame(step)};
      requestAnimationFrame(step);
    }
  }else if(it.k==='further'){
    if(it.scrim==='strong')s.classList.add('strong');
    s.style.setProperty('--kb',(it.d+2)+'s');
    const when=it.seed_year||it.label||'';
    s.innerHTML='<div class="ph"><img src="'+esc(UP+'video/assets/photos/'+it.key+'.jpg')+'" alt=""></div><div class="scrim"></div><div class="in"><p class="k w">Further · '+esc(it.year)+'</p><p class="hero d1">'+esc(it.hero)+'</p><p class="seed d2">'+(when?'<b>'+esc(when)+'</b>':'')+esc(it.seed)+'</p>'+(it.film?'<p class="film d3">Imagined in '+esc(it.film)+'</p>':'')+'</div><p class="credit">'+esc(it.credit||'')+'</p>';
  }else if(it.k==='quote'){
    s.innerHTML=glow+'<div class="in"><p class="k w">From the books · 2050</p><p class="q'+size(words(it.q),14,26)+'"><span class="qm">“</span>'+qh(it.q)+'<span class="qm">”</span></p><p class="by d2"><b>'+esc(it.by)+'</b><span>'+esc(it.book)+', '+esc(it.y)+'</span></p></div>';
  }else if(it.k==='idea'){
    const st={here:'Already here',progress:'Under way'}[it.st]||'Today';
    s.innerHTML=glow+'<div class="in"><p class="k w">'+esc((CH[it.ch]||{}).title||'')+' · an idea for 2050</p><p class="h">'+esc(it.h)+'</p><p class="t d2">'+esc(it.t)+'</p>'+(it.stt?'<p class="now d3"><span>'+esc(st)+'</span>'+esc(it.stt)+'</p>':'')+'<p class="src d3">'+esc(it.src)+'</p></div>';
  }else if(it.k==='tweet'){
    const av=D.avatars[it.h];
    s.innerHTML=glow+'<div class="in"><p class="k">On X · '+esc((CH[it.ch]||{}).title||'')+'</p><div class="who">'+(av?'<img class="av" src="'+av+'" alt="">':'')+'<div><div class="nm">'+esc(it.name)+'</div><div class="rl">'+esc(it.role)+'</div></div></div><p class="tx'+size(words(it.text),20,40)+'">'+esc(it.text)+'</p><p class="meta d3">@'+esc(it.h)+' · '+esc(it.date)+'</p></div>';
  }else if(it.k==='pic'){
    const p=picOf(it);
    if(!p){s.innerHTML=glow;return s}
    s.style.setProperty('--kb',(it.d+2)+'s');
    const src=picSrc(p),thumb=UP+p.thumb;
    s.innerHTML='<img class="bg" src="'+esc(thumb)+'" alt=""><img class="fg" src="'+esc(src)+'" alt="'+esc(p.desc)+'"><p class="cap"><b>'+esc(p.desc)+'</b><span>'+esc(p.artist)+' · posted by @'+esc(p.handle)+' on X'+(p.year?', '+esc(p.year):'')+'</span></p>';
    const fg=s.querySelector('.fg');fg.addEventListener('error',()=>{if(fg.src!==new URL(thumb,location.href).href)fg.src=thumb},{once:true});
  }else if(it.k==='film'){
    const f=D.films[it.film];
    s.innerHTML='<video playsinline preload="auto"></video><p class="tag">'+esc(f.title)+' · '+esc(f.sub)+'</p>';
    const v=s.querySelector('video');
    f.sources.forEach(src=>{const so=document.createElement('source');so.src=UP+src;so.type='video/mp4';v.appendChild(so)});
    v.lastElementChild.addEventListener('error',()=>{if(S.el===s)setTimeout(()=>{if(S.el===s)go(S.i+1)},900)});
    v.addEventListener('ended',()=>{if(S.el===s)go(S.i+1)});
  }
  return s;
}
function preload(it){
  if(!it)return;
  if(it.k==='further'){const im=new Image();im.src=UP+'video/assets/photos/'+it.key+'.jpg'}
  else if(it.k==='pic'){const p=picOf(it);if(p){const im=new Image();im.src=picSrc(p)}}
}

/* ---------- the player ---------- */
const pj=$('pj'),stage=$('stage'),prog=$('prog'),chip=$('chip');
const S={open:false,i:0,el:null,video:null,playing:true,sound:false,elapsed:0,last:0,raf:0,idleT:0,lock:null,prevFocus:null};
$('chs').innerHTML=D.chapters.map((c,i)=>'<button type="button" data-ch="'+esc(c.id)+'" style="--c:'+esc(c.color)+'" title="'+esc(c.title)+' ('+(i+1)+')">'+esc(c.title)+'</button>').join('');
const chapterStart=id=>PL.findIndex(it=>it.k==='card'&&it.ch===id);
function render(){
  const it=PL[S.i];
  const old=stage.querySelector(':scope>.s:not(.out)');
  if(old){old.classList.add('out');const ov=old.querySelector('video');if(ov){ov.pause();ov.muted=true}setTimeout(()=>{const v=old.querySelector('video');if(v){v.removeAttribute('src');v.querySelectorAll('source').forEach(x=>x.remove());v.load()}old.remove()},600)}
  const s=build(it,S.i);S.el=s;S.video=null;stage.appendChild(s);
  const c=colorOf(it.ch);pj.style.setProperty('--c',c);
  if(it.k==='film'){
    const v=s.querySelector('video');S.video=v;v.muted=!S.sound;
    if(S.playing)v.play().catch(()=>{v.muted=true;S.sound=false;sound();v.play().catch(()=>{})});
  }
  const ch=CH[it.ch];
  chip.hidden=!ch||it.k==='film'||it.k==='intro'||it.k==='card';
  if(ch){chip.querySelector('span').textContent=ch.title+' · '+(ch.i+1)+'/'+D.chapters.length}
  $('chs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(!!ch&&b.dataset.ch===ch.id)));
  $('cnt').textContent=(S.i+1)+' / '+PL.length;
  preload(PL[(S.i+1)%PL.length]);
}
function go(pos){
  if(pos>=PL.length){pos=0;newLoop()}
  if(pos<0)pos=PL.length-1;
  S.i=pos;S.elapsed=0;prog.style.width='0%';render();
}
function tick(ts){
  if(!S.open)return;
  if(!S.last)S.last=ts;
  const dt=ts-S.last;S.last=ts;
  const it=PL[S.i];
  if(it.k==='film'){
    const v=S.video;prog.style.width=(v&&v.duration?Math.min(100,v.currentTime/v.duration*100):0)+'%';
  }else{
    if(S.playing){S.elapsed+=dt;if(S.elapsed>=it.d*1000){go(S.i+1)}}
    prog.style.width=Math.min(100,S.elapsed/(it.d*1000)*100)+'%';
  }
  S.raf=requestAnimationFrame(tick);
}
function setPlaying(on){
  S.playing=on;$('bPlay').textContent=on?'Pause':'Resume';$('paused').hidden=on;
  if(S.video){on?S.video.play().catch(()=>{}):S.video.pause()}
  }
function sound(){$('bSound').textContent=S.sound?'Sound on':'Sound off';if(S.video)S.video.muted=!S.sound}
function poke(){pj.classList.remove('idle');clearTimeout(S.idleT);S.idleT=setTimeout(()=>{if(S.open)pj.classList.add('idle')},2600)}
async function wake(on){
  try{
    if(on&&navigator.wakeLock&&!S.lock){S.lock=await navigator.wakeLock.request('screen');S.lock.addEventListener&&S.lock.addEventListener('release',()=>{S.lock=null})}
    if(!on&&S.lock){await S.lock.release();S.lock=null}
  }catch(e){S.lock=null}
}
function open(pos,withSound){
  if(!S.open)S.prevFocus=document.activeElement;
  S.sound=!!withSound;sound();
  pj.hidden=false;$('home').hidden=true;document.documentElement.style.overflow='hidden';
  S.open=true;stage.innerHTML='';setPlaying(true);go(pos||0);S.last=0;
  cancelAnimationFrame(S.raf);S.raf=requestAnimationFrame(tick);
  poke();wake(true);
  try{$('bPlay').focus({preventScroll:true})}catch(e){}
}
function close(){
  S.open=false;cancelAnimationFrame(S.raf);clearTimeout(S.idleT);
  if(S.video)S.video.pause();
  pj.hidden=true;pj.classList.remove('idle');$('home').hidden=false;document.documentElement.style.overflow='';
  stage.innerHTML='';S.el=null;S.video=null;wake(false);
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  try{S.prevFocus&&S.prevFocus.focus({preventScroll:true})}catch(e){}
}
function full(){
  try{
    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
    else if(pj.requestFullscreen)pj.requestFullscreen().catch(()=>{});
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{$('bFull').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen'});
stage.addEventListener('click',()=>{go(S.i+1);poke()});
$('bPrev').addEventListener('click',()=>{go(S.i-1);poke()});
$('bNext').addEventListener('click',()=>{go(S.i+1);poke()});
$('bPlay').addEventListener('click',()=>{setPlaying(!S.playing);poke()});
$('bSound').addEventListener('click',()=>{S.sound=!S.sound;sound();poke()});
$('bFull').addEventListener('click',()=>{full();poke()});
$('bExit').addEventListener('click',close);
pj.addEventListener('pointermove',poke);
$('start').addEventListener('click',()=>open(0,true));
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-ch]');if(!b)return;
  const i=chapterStart(b.dataset.ch);if(i<0)return;
  if(S.open){go(i);poke()}else open(i,true);
});
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(!S.open){
    if((k==='Enter'&&e.target===document.body)||k==='f'||k==='F'||k==='а'||k==='А'){e.preventDefault();open(0,true);if(k!=='Enter')full()}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(S.i+1);poke()}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(S.i-1);poke()}
  else if(k===' '||k==='Spacebar'){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();setPlaying(!S.playing);poke()}
  else if(k==='f'||k==='F'||k==='а'||k==='А'){e.preventDefault();full()}
  else if(k==='m'||k==='M'||k==='ь'||k==='Ь'){e.preventDefault();S.sound=!S.sound;sound();poke()}
  else if(/^[1-9]$/.test(k)&&D.chapters[+k-1]){e.preventDefault();go(chapterStart(D.chapters[+k-1].id));poke()}
  else if(k==='Escape'){if(!document.fullscreenElement)close()}
});
document.addEventListener('visibilitychange',()=>{if(S.open&&document.visibilityState==='visible')wake(true)});

/* #play starts the wall (muted: a link cannot start sound); #planet, #machines ... start at that chapter */
function fromHash(){
  const h=location.hash.slice(1);if(!h||S.open)return;
  if(h==='play'||h==='wall'){open(0,false);return}
  const i=chapterStart(h);if(i>=0)open(i,false);
}
window.addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
