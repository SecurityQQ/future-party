<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030817">
<title>Varga Future Party 2050 · Slides</title>
<meta name="description" content="The host's deck for Varga Future Party 2050: the vision, the goal, the three rules, a mini demo for every station, and the question for the room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--FONTS-->
<style>
/* The player: one 1920×1080 slide at a time, scaled to the window, deep space around it. The palette is the website's
   Blue futurism (vibes/tokens.css), put here by slides/build.py. */
/*VIBES_TOKENS*/
html,body{margin:0;height:100%;background:var(--v-space);overflow:hidden}
*{margin:0}
body{font:32px/1.2 'Geologica',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#stage>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;isolation:isolate}
#stage>section:not(.on){display:none!important}
#stage>section.on{animation:deckIn .35s ease both}
@keyframes deckIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){#stage>section.on{animation:none}}
/* A full-bleed picture or drawing listed first stays behind the slide's text */
#stage>section>svg:first-child,#stage>section>img:first-child{z-index:-1}
h1{font-size:96px;font-weight:600}h2{font-size:64px;font-weight:600}h3{font-size:44px;font-weight:600}
img,video,iframe{display:block;border:0}
aside{display:none}
/* Host helpers: N shows the speaker notes, the hint shows once on open */
#notes{position:fixed;left:16px;right:16px;bottom:16px;max-width:1100px;margin:0 auto;padding:14px 18px;border-radius:14px;background:rgb(7 19 43 / 96%);color:var(--v-ink);font:16px/1.55 'Geologica',system-ui,sans-serif;border:1px solid rgb(143 170 207 / 42%);border-top-color:#7d9ac0;box-shadow:inset 0 1px 0 rgb(220 233 251 / 8%);display:none;z-index:10}
#notes.show{display:block}
#notes b{display:block;margin-bottom:4px;color:var(--v-ice);font:500 11px/1.4 'Martian Mono',ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgb(7 19 43 / 90%);border:1px solid rgb(143 170 207 / 32%);color:var(--v-muted);font:400 11px/1.4 'Martian Mono',ui-monospace,monospace;letter-spacing:.03em;white-space:nowrap;z-index:9;transition:opacity .6s ease;pointer-events:none}
#hint.gone{opacity:0}
body.idle,body.idle *{cursor:none!important}
/*DECK*/
</style>
</head>
<body>
<main id="stage">
<!--SLIDES-->
</main>
<div id="notes" role="note" aria-live="polite"></div>
<div id="hint">→ or click: next · ← back · F full screen · N notes</div>
<script>
(function(){
  const stage = document.getElementById('stage');
  const slides = Array.from(stage.children).filter(e => e.tagName === 'SECTION');
  const notes = document.getElementById('notes');
  const hint = document.getElementById('hint');
  let cur = -1, step = 0;

  // Fit the 1920×1080 canvas to the window
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * k) / 2 + 'px,' + (innerHeight - 1080 * k) / 2 + 'px) scale(' + k + ')';
  }

  // Click steps on a slide: fragments with data-fragment-index first (lowest first, one index = one click), then the rest in order
  function groups(s) {
    const all = Array.from(s.querySelectorAll('.fragment'));
    const byIndex = new Map(), out = [];
    all.filter(f => f.hasAttribute('data-fragment-index'))
       .sort((a, b) => a.dataset.fragmentIndex - b.dataset.fragmentIndex)
       .forEach(f => { const k = f.dataset.fragmentIndex; if (!byIndex.has(k)) { byIndex.set(k, []); out.push(byIndex.get(k)); } byIndex.get(k).push(f); });
    all.filter(f => !f.hasAttribute('data-fragment-index')).forEach(f => out.push([f]));
    return out;
  }
  function setStep(n) {
    const g = groups(slides[cur]);
    step = Math.max(0, Math.min(n, g.length));
    g.forEach((grp, i) => grp.forEach(f => { f.classList.toggle('visible', i < step); f.classList.toggle('current-fragment', i === step - 1); }));
  }

  // The show reel clip loops its first seconds; YouTube loads only on its slide and stops when you leave it
  document.querySelectorAll('video[data-clip]').forEach(v => {
    const [a, b] = v.dataset.clip.split(',').map(Number);
    v.addEventListener('timeupdate', () => { if (v.currentTime >= b) v.currentTime = a; });
  });
  // A number marked .n counts up from 0 when its slide arrives (Slides does this with @property; a browser needs a nudge)
  function countUp(el) {
    const end = Number(el.dataset.n || (el.dataset.n = el.textContent.trim()));
    if (!Number.isFinite(end)) return;
    const t0 = performance.now(), dur = 1600;
    const tick = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1 && el.closest('section.on')) requestAnimationFrame(tick); else el.textContent = end; };
    requestAnimationFrame(tick);
  }
  function media(s, on) {
    if (on) s.querySelectorAll('.n').forEach(countUp);
    s.querySelectorAll('video').forEach(v => {
      if (on) { if (v.dataset.clip) v.currentTime = Number(v.dataset.clip.split(',')[0]); v.play().catch(() => {}); }
      else v.pause();
    });
    s.querySelectorAll('iframe[data-src]').forEach(f => {
      if (on) { if (f.getAttribute('src') !== f.dataset.src) f.setAttribute('src', f.dataset.src); }
      else if (f.hasAttribute('src')) f.setAttribute('src', 'about:blank');
    });
  }

  function writeNotes() {
    const a = slides[cur].querySelector('aside');
    notes.innerHTML = '<b>Slide ' + (cur + 1) + ' of ' + slides.length + '</b>';
    notes.appendChild(document.createTextNode(a ? a.textContent.trim() : 'No notes on this slide.'));
  }

  function show(i, atEnd) {
    i = Math.max(0, Math.min(i, slides.length - 1));
    if (i !== cur) {
      if (cur >= 0) { slides[cur].classList.remove('on'); media(slides[cur], false); }
      cur = i;
      slides[cur].classList.add('on');
      media(slides[cur], true);
    }
    setStep(atEnd ? Infinity : 0);
    const h = '#' + (cur + 1);
    if (location.hash !== h) history.replaceState(null, '', h);
    writeNotes();
  }
  function next() { if (step < groups(slides[cur]).length) setStep(step + 1); else if (cur < slides.length - 1) show(cur + 1); }
  function prev() { if (step > 0) setStep(step - 1); else if (cur > 0) show(cur - 1, true); }

  // #12 opens slide 12, #tonight opens the slide with that id
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (/^\d+$/.test(h)) return Number(h) - 1;
    const m = /^slide-(\d+)$/.exec(h);
    if (m) return Number(m[1]) - 1;
    const i = slides.findIndex(s => s.id === h);
    return i < 0 ? 0 : i;
  }

  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1, true);
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'n' || k === 'N') notes.classList.toggle('show');
    else return;
    hint.classList.add('gone');
  });
  // Click: left third goes back, the rest goes forward. Links, videos and the YouTube player keep their own clicks.
  addEventListener('click', e => {
    if (e.button !== 0 || e.target.closest('a,iframe,video,#notes')) return;
    if (e.clientX < innerWidth / 3) prev(); else next();
    hint.classList.add('gone');
  });
  let tx = null, ty = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
  addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); hint.classList.add('gone'); }
  }, {passive: true});
  addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) show(i); });
  addEventListener('resize', fit);
  let idle;
  addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2500); });

  fit();
  show(fromHash());
  setTimeout(() => hint.classList.add('gone'), 4000);
})();
</script>
</body>
</html>
